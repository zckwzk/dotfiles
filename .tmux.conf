# ==============================================================================
# ~/.tmux.conf - Zakaniwa Dotfiles Tmux Configuration
# ==============================================================================

# --- General Settings ---
# Set prefix key to Ctrl-a (and keep Ctrl-b as secondary)
set -g prefix C-a
bind C-a send-prefix

# Reload configuration easily with Prefix + r
bind r source-file ~/.tmux.conf \; display-message " Tmux configuration reloaded! "

# Set default terminal mode to 256-color with TrueColor (Tc / RGB) support
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"

# Increase scrollback history limit
set -g history-limit 10000

# Faster command sequences (no delay on ESC in Neovim/Vim)
set -s escape-time 0

# Enable mouse support (click panes, scroll, resize panes)
set -g mouse on

# Start window and pane numbering at 1 instead of 0 (matches keyboard number row)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Keybindings ---
# Split panes using | and - (and preserve current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new window with current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with Alt + arrow keys or Ctrl + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi mode for copy/scroll mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status Bar & Aesthetics ---
set -g status-position bottom
set -g status-interval 3
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status: Session name badge
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=default] "

# Right status: Host & Clock
set -g status-right-length 50
set -g status-right "#[fg=#6c7086]%Y-%m-%d #[fg=#a6adc8]| #[fg=#cdd6f4,bold]%H:%M #[bg=#b4befe,fg=#11111b,bold] #h "

# Window status tabs
setw -g window-status-format "#[fg=#6c7086] #I: #W "
setw -g window-status-current-format "#[bg=#313244,fg=#f5c2e7,bold] #I: #W* "

# Border styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ==============================================================================
# --- Tmux Plugin Manager (TPM) ---
# ==============================================================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic TPM installation if not already cloned (for bootstrap on new machines)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

